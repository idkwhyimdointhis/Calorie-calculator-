<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FUEL</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080808;
  --surface: #0f0f0f;
  --surface2: #141414;
  --border: #1c1c1c;
  --blue: #2563eb;
  --blue-b: #3b82f6;
  --green: #16a34a;
  --green-b: #22c55e;
  --green-d: #15803d;
  --amber: #f59e0b;
  --red: #dc2626;
  --red-b: #ef4444;
  --text: #e8e8e8;
  --muted: #555;
  --dim: #888;
  --mono: 'Space Mono', monospace;
  --sans: 'Syne', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
}

/* ══ LAYOUT ══ */
#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

.t-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 13px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.logo { font-family: var(--sans); font-weight: 800; font-size: 16px; letter-spacing: 6px; color: var(--green-b); }
.hdr-right { display: flex; align-items: center; gap: 10px; }
.t-date { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.streak-badge {
  font-family: var(--mono); font-size: 10px;
  background: #0a1a0a; border: 1px solid #1a3a1a;
  border-radius: 20px; padding: 3px 9px;
  color: var(--green-b); letter-spacing: 1px;
}

/* ══ TABS ══ */
.tabs {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tab {
  flex: 1; padding: 10px 6px;
  background: none; border: none;
  font-family: var(--mono); font-size: 9px;
  color: var(--muted); letter-spacing: 1.5px;
  cursor: pointer; transition: all 0.2s;
  border-bottom: 2px solid transparent;
}
.tab.active { color: var(--green-b); border-bottom-color: var(--green-b); }

/* ══ SCROLL ══ */
.t-scroll { flex: 1; overflow-y: auto; padding: 13px 13px 80px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ══ DAY NAV ══ */
.day-row { display: flex; align-items: center; gap: 7px; margin-bottom: 13px; }
.dnav { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--dim); cursor: pointer; font-size: 16px; padding: 6px 11px; flex-shrink: 0; transition: all 0.2s; }
.dnav:hover { border-color: var(--blue); color: var(--blue-b); }
.ddisp { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-family: var(--mono); font-size: 10px; color: var(--text); flex: 1; text-align: center; }
.dclear { background: none; border: 1px solid #1a0a0a; border-radius: 6px; color: #444; font-family: var(--mono); font-size: 10px; cursor: pointer; padding: 6px 9px; flex-shrink: 0; transition: all 0.2s; }
.dclear:hover { border-color: var(--red); color: var(--red); }

/* ══ TOTALS ══ */
.tots { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-bottom: 12px; }
.tc { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 10px 7px; text-align: center; position: relative; overflow: hidden; }
.tc::before { content:''; position:absolute; top:0;left:0;right:0; height:2px; }
.tc.cal::before { background: var(--blue-b); }
.tc.pro::before { background: var(--green-b); }
.tc.crb::before { background: var(--amber); }
.tc.fat::before { background: var(--red-b); }
.tl { font-family: var(--mono); font-size: 8px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }
.tv { font-family: var(--mono); font-size: 18px; font-weight: 700; line-height: 1; }
.tc.cal .tv { color: var(--blue-b); }
.tc.pro .tv { color: var(--green-b); }
.tc.crb .tv { color: var(--amber); }
.tc.fat .tv { color: var(--red-b); }
.tu { font-family: var(--mono); font-size: 8px; color: var(--muted); }

/* ══ MACRO GOALS ══ */
.goals-c { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 12px 13px; margin-bottom: 12px; }
.goals-title { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: 2px; margin-bottom: 10px; }
.goal-row { margin-bottom: 7px; }
.goal-row:last-child { margin-bottom: 0; }
.goal-meta { display: flex; justify-content: space-between; margin-bottom: 3px; }
.goal-lbl { font-family: var(--mono); font-size: 9px; }
.goal-lbl.cal { color: var(--blue-b); }
.goal-lbl.pro { color: var(--green-b); }
.goal-lbl.crb { color: var(--amber); }
.goal-lbl.fat { color: var(--red-b); }
.goal-val { font-family: var(--mono); font-size: 9px; color: var(--dim); }
.goal-val.over { color: var(--red-b); }
.gtrack { background: var(--border); border-radius: 2px; height: 3px; overflow: hidden; }
.gfill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
.gfill.cal { background: var(--blue-b); }
.gfill.pro { background: var(--green-b); }
.gfill.crb { background: var(--amber); }
.gfill.fat { background: var(--red-b); }
.gfill.over { background: var(--red); }

.goals-edit { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; display: none; }
.goals-edit.open { display: block; }
.goals-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 7px; margin-bottom: 8px; }
.gedit-item label { font-family: var(--mono); font-size: 9px; color: var(--muted); display: block; margin-bottom: 3px; }
.gedit-item input { background: var(--bg); border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-family: var(--mono); font-size: 11px; padding: 5px 8px; width: 100%; -moz-appearance:textfield; }
.gedit-item input::-webkit-outer-spin-button,.gedit-item input::-webkit-inner-spin-button{-webkit-appearance:none;}
.gedit-item input:focus { outline: none; border-color: var(--blue); }
.goal-edit-btn { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
.goal-toggle { background: none; border: none; font-family: var(--mono); font-size: 9px; color: var(--muted); cursor: pointer; padding: 2px 0; letter-spacing: 1px; }
.goal-toggle:hover { color: var(--dim); }
.gsave { background: none; border: 1px solid #1d4ed8; border-radius: 5px; color: var(--blue-b); font-family: var(--mono); font-size: 10px; cursor: pointer; padding: 5px 12px; transition: all 0.2s; }
.gsave:hover { background: var(--blue); color: #fff; }

/* ══ CRAVING ══ */
.crav-c { background: #0a120a; border: 1px solid #162016; border-radius: 7px; padding: 10px 12px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.crav-ttl { font-weight: 700; font-size: 12px; color: var(--green-b); margin-bottom: 1px; }
.crav-sub { font-family: var(--mono); font-size: 9px; color: var(--muted); }
.crav-btn { background: #0f1f0f; border: 1px solid #1a3a1a; border-radius: 6px; color: var(--green-b); font-family: var(--mono); font-size: 9px; cursor: pointer; padding: 7px 9px; text-align: center; line-height: 1.4; flex-shrink: 0; transition: all 0.2s; }

/* ══ LOG HEADER ══ */
.shdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.stitle { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
.brow { display: flex; gap: 5px; }

.bblu { background: var(--blue); border: none; border-radius: 6px; color: #fff; font-family: var(--mono); font-size: 10px; cursor: pointer; padding: 7px 10px; letter-spacing: 1px; transition: all 0.2s; }
.bblu:hover { background: #1d4ed8; }
.bgrn { background: var(--green); border: none; border-radius: 6px; color: #fff; font-family: var(--mono); font-size: 10px; cursor: pointer; padding: 7px 10px; letter-spacing: 1px; transition: all 0.2s; }
.bgrn:hover { background: var(--green-d); }
.bgst { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--dim); font-family: var(--mono); font-size: 10px; cursor: pointer; padding: 7px 10px; transition: all 0.2s; }
.bgst:hover { border-color: var(--dim); color: var(--text); }
.bamb { background: none; border: 1px solid #4a3000; border-radius: 6px; color: var(--amber); font-family: var(--mono); font-size: 10px; cursor: pointer; padding: 7px 10px; letter-spacing: 1px; transition: all 0.2s; }
.bamb:hover { background: #1a1000; }

/* ══ FORMS ══ */
input[type="text"], input[type="number"] {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 8px 9px;
  width: 100%;
  transition: border-color 0.2s;
  -moz-appearance: textfield;
}
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;}
input:focus { outline: none; border-color: var(--blue); }

.fcard { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 13px; margin-bottom: 9px; display: none; }
.fcard.open { display: block; }
.flbl { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: 1px; margin-bottom: 4px; display: block; }
.fmain { display: flex; gap: 7px; margin-bottom: 9px; }
.fmain input:first-child { flex: 2; }
.fmain input:last-child { flex: 1; }
.mtoggle { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
.mtoggle input[type="checkbox"] { accent-color: var(--blue); width: 14px; height: 14px; cursor: pointer; }
.mtoggle label { font-family: var(--mono); font-size: 10px; color: var(--dim); cursor: pointer; }
.mrow { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin-bottom: 9px; }
.facts { display: flex; gap: 7px; justify-content: flex-end; margin-top: 4px; }
.save-toggle { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
.save-toggle input[type="checkbox"] { accent-color: var(--amber); width: 14px; height: 14px; cursor: pointer; }
.save-toggle label { font-family: var(--mono); font-size: 10px; color: var(--amber); cursor: pointer; }

/* Meal builder */
.mcard { background: var(--surface); border: 1px solid #162016; border-radius: 7px; padding: 13px; margin-bottom: 9px; display: none; }
.mcard.open { display: block; }
.mninp { background: var(--bg); border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-family: var(--sans); font-weight: 700; font-size: 13px; padding: 8px 11px; width: 100%; margin-bottom: 11px; }
.mninp:focus { outline: none; border-color: var(--green); }
.ing-r { display: grid; grid-template-columns: 2fr 1fr 26px; gap: 5px; margin-bottom: 5px; align-items: center; }
.irem { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0; transition: color 0.2s; }
.irem:hover { color: var(--red); }
.mprev { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 11px; margin: 9px 0; display: flex; gap: 14px; flex-wrap: wrap; }
.mpi { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.mpv { font-family: var(--mono); font-size: 14px; font-weight: 700; }
.mpl { font-family: var(--mono); font-size: 8px; color: var(--muted); text-transform: uppercase; }

/* ══ LOG ══ */
.log-w { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.lempty { padding: 32px 16px; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--muted); }

.lentry { padding: 10px 13px; border-bottom: 1px solid var(--border); transition: background 0.15s; }
.lentry:last-child { border-bottom: none; }
.lentry:hover { background: var(--surface2); }
.l1 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
.lname { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 8px; }
.lcal { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--blue-b); flex-shrink: 0; }
.l2 { display: flex; align-items: center; justify-content: space-between; }
.lmac { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.lmac .pp { color: var(--green-b); }
.lmac .cp { color: var(--amber); }
.lmac .fp { color: var(--red-b); }
.lactions { display: flex; gap: 5px; align-items: center; }
.ldel { background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); cursor: pointer; font-family: var(--mono); font-size: 9px; padding: 3px 7px; transition: all 0.15s; flex-shrink: 0; }
.ldel:hover { border-color: var(--red); color: var(--red); background: #1a0a0a; }
.ledit { background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); cursor: pointer; font-family: var(--mono); font-size: 9px; padding: 3px 7px; transition: all 0.15s; flex-shrink: 0; }
.ledit:hover { border-color: var(--blue); color: var(--blue-b); background: #0a0f1a; }

/* Meal group */
.mghdr { padding: 9px 13px 7px; background: #0a150a; border-bottom: 1px solid #162016; display: flex; align-items: center; justify-content: space-between; }
.mgl { flex: 1; }
.mgn { font-family: var(--sans); font-weight: 700; font-size: 12px; color: var(--green-b); text-transform: uppercase; letter-spacing: 1px; }
.mgc { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 1px; }
.mgc span { color: var(--blue-b); }
.mgmac { font-family: var(--mono); font-size: 9px; color: var(--muted); margin-top: 1px; }
.mgmac .pp { color: var(--green-b); }
.mgmac .cp { color: var(--amber); }
.mgmac .fp { color: var(--red-b); }
.mgir { padding: 7px 13px 7px 24px; border-bottom: 1px solid #111; background: #080808; }
.mgir:last-child { border-bottom: none; }
.mgil1 { display: flex; justify-content: space-between; }
.mgin { font-family: var(--mono); font-size: 11px; color: var(--dim); }
.mgic { font-family: var(--mono); font-size: 11px; color: var(--blue-b); }

/* ══ SAVED MEALS TAB ══ */
.saved-list { display: flex; flex-direction: column; gap: 8px; }
.saved-empty { padding: 40px 16px; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--muted); line-height: 1.8; }
.saved-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 13px;
  display: flex; align-items: center; gap: 10px;
  transition: border-color 0.2s;
}
.saved-card:hover { border-color: #2a2a2a; }
.saved-info { flex: 1; min-width: 0; }
.saved-name { font-family: var(--sans); font-weight: 700; font-size: 13px; color: var(--text); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.saved-meta { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.saved-meta .sc { color: var(--blue-b); }
.saved-meta .sp { color: var(--green-b); }
.saved-meta .sca { color: var(--amber); }
.saved-meta .sf { color: var(--red-b); }
.saved-actions { display: flex; gap: 5px; flex-shrink: 0; }
.sadd { background: var(--green); border: none; border-radius: 6px; color: #fff; font-family: var(--mono); font-size: 10px; cursor: pointer; padding: 7px 11px; transition: all 0.2s; letter-spacing: 1px; }
.sadd:active { transform: scale(0.95); }
.sadd:hover { background: var(--green-d); }
.sdel { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-family: var(--mono); font-size: 10px; cursor: pointer; padding: 7px 8px; transition: all 0.2s; }
.sdel:hover { border-color: var(--red); color: var(--red); }
.saved-type { font-family: var(--mono); font-size: 8px; color: var(--muted); letter-spacing: 1px; margin-bottom: 3px; }

/* ══ HISTORY TAB ══ */
.hist-week { display: flex; gap: 5px; margin-bottom: 14px; }
.hist-day {
  flex: 1; background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 4px; text-align: center; cursor: pointer;
  transition: all 0.2s;
}
.hist-day.today { border-color: var(--blue-b); }
.hist-day.hit { border-color: var(--green-b); }
.hist-day:hover { border-color: #333; }
.hd-label { font-family: var(--mono); font-size: 8px; color: var(--muted); margin-bottom: 4px; }
.hd-bar-wrap { height: 40px; display: flex; align-items: flex-end; justify-content: center; margin-bottom: 4px; }
.hd-bar { width: 16px; border-radius: 2px 2px 0 0; background: var(--border); transition: height 0.4s ease; min-height: 2px; }
.hd-bar.hit { background: var(--green-b); }
.hd-bar.over { background: var(--red-b); }
.hd-cal { font-family: var(--mono); font-size: 8px; color: var(--dim); }

.hist-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin-bottom: 14px; }
.hstat { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 11px 8px; text-align: center; }
.hstat-v { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--green-b); }
.hstat-l { font-family: var(--mono); font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

.hist-list { display: flex; flex-direction: column; gap: 6px; }
.hist-entry {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 10px 12px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; transition: all 0.2s;
}
.hist-entry:hover { border-color: #2a2a2a; background: var(--surface2); }
.hist-entry.hit { border-left: 3px solid var(--green-b); }
.hist-entry.miss { border-left: 3px solid var(--border); }
.he-date { font-family: var(--mono); font-size: 10px; color: var(--text); }
.he-kcal { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--blue-b); }
.he-status { font-family: var(--mono); font-size: 9px; color: var(--muted); }
.he-status.hit { color: var(--green-b); }

/* ══ MODAL ══ */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-bg.open { display: flex; }
.modal { background: var(--surface); border: 1px solid #162016; border-radius: 12px; padding: 24px 20px; max-width: 360px; width: 100%; text-align: center; }
.mico { font-size: 36px; margin-bottom: 10px; }
.mttl { font-family: var(--sans); font-weight: 800; font-size: 18px; color: var(--green-b); margin-bottom: 6px; }
.mbod { font-family: var(--mono); font-size: 11px; color: var(--dim); line-height: 1.7; margin-bottom: 12px; }
.mqt { background: var(--bg); border-left: 3px solid var(--green-b); border-radius: 4px; padding: 8px 12px; font-family: var(--mono); font-size: 10px; color: var(--green-b); font-style: italic; margin-bottom: 14px; text-align: left; }
.macts { display: flex; gap: 8px; justify-content: center; }
.myes { background: var(--green); border: none; border-radius: 6px; color: #fff; font-family: var(--mono); font-size: 11px; cursor: pointer; padding: 10px 16px; }
.mno { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--dim); font-family: var(--mono); font-size: 11px; cursor: pointer; padding: 10px 14px; }

/* Edit modal */
.edit-modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 360px; width: 100%; }
.edit-title { font-family: var(--sans); font-weight: 800; font-size: 15px; color: var(--text); margin-bottom: 14px; letter-spacing: 1px; }
.edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.edit-full { margin-bottom: 8px; }
.edit-actions { display: flex; gap: 7px; justify-content: flex-end; margin-top: 12px; }

/* ══ TOAST ══ */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #111; border: 1px solid var(--green-b);
  border-radius: 20px; padding: 8px 16px;
  font-family: var(--mono); font-size: 11px; color: var(--green-b);
  z-index: 500; opacity: 0; transition: all 0.3s; pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* scrollbar */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div class="t-header">
    <div class="logo">FUEL</div>
    <div class="hdr-right">
      <div class="streak-badge" id="streakBadge">🔥 0 DAY</div>
      <div class="t-date" id="hdrDate"></div>
    </div>
  </div>

  <!-- TABS -->

<!-- Edit Modal -->
<div class="modal-bg" id="editM">
  <div class="edit-modal">
    <div class="edit-title">EDIT ENTRY</div>
    <input type="hidden" id="editId" />

      <label class="flbl">NAME</label>
      <input type="text" id="eName" />
    </div>
    <div class="edit-full">
      <label class="flbl">CALORIES (kcal)</label>
      <input type="number" id="eCal" />
    </div>
    <div class="edit-grid">
      <div><label class="flbl" style="color:var(--green-b)">PROTEIN (g)</label><input type="number" id="eProt" placeholder="--" /></div>
      <div><label class="flbl" style="color:var(--amber)">CARBS (g)</label><input type="number" id="eCarb" placeholder="--" /></div>
      <div><label class="flbl" style="color:var(--red-b)">FAT (g)</label><input type="number" id="eFat" placeholder="--" /></div>
    </div>
    <div class="edit-actions">
      <button class="bgst" onclick="closeEdit()">Cancel</button>
      <button class="bblu" onclick="saveEdit()">SAVE</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════ DATA ═══════════
const CRAVINGS = [
  { t:'HOLD UP.', b:'Drink a full glass of water and wait 10 minutes. 90% of cravings vanish. You have worked too hard to blow it now.' },
  { t:'IS IT WORTH IT?', b:'Will you feel good about this in an hour? Grab a diet soda or sparkling water. The craving passes -- your progress does not come back as fast.' },
  { t:'THINK LIKE AN ATHLETE.', b:'Your body is your tool. Fuel it right or fall behind.' },
  { t:'PAUSE.', b:'You built this through discipline. One craving does not define you -- how you respond to it does. Hydrate and keep going.' },
  { t:'NOT TODAY.', b:'You are stronger than this craving. Walk away, drink water, and in 15 minutes you will be glad you did.' },
];
const QUOTES = [
  'Discipline is choosing what you want most over what you want now.',
  'Every meal is a vote for the body you are building.',
  'Champions are not born in comfort. They are forged through sacrifice.',
  'Results happen over time, not overnight. Stay consistent.',
  'Your future self is watching. Do not let them down.',
];

// ═══════════ STATE ═══════════
let db = {};
try { db = JSON.parse(localStorage.getItem('fuelDB')||'{}'); } catch{}

let goals = { cal:2000, pro:150, crb:200, fat:65 };
try { const g = JSON.parse(localStorage.getItem('fuelGoals')||'null'); if(g) goals = g; } catch{}

let savedFoods = [];
try { savedFoods = JSON.parse(localStorage.getItem('fuelSaved')||'[]'); } catch{}

function saveDB() { localStorage.setItem('fuelDB', JSON.stringify(db)); }
function saveGoalsDB() { localStorage.setItem('fuelGoals', JSON.stringify(goals)); }
function saveFoodsDB() { localStorage.setItem('fuelSaved', JSON.stringify(savedFoods)); }

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
let curDay = todayKey();
function getDayData(key) {
  const k = key || curDay;
  if (!db[k]) db[k] = {entries:[]};
  return db[k];
}

// ═══════════ TABS ═══════════
let curTab = 'log';
function switchTab(name) {
  curTab = name;
  document.querySelectorAll('.tab').forEach((t,i) => {
    const names = ['log','saved','history'];
    t.classList.toggle('active', names[i] === name);
  });
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if (name === 'saved') renderSaved();
  if (name === 'history') renderHistory();
}

// ═══════════ GOALS ═══════════
function toggleGoalEdit() {
  const el = document.getElementById('goalsEdit');
  el.classList.toggle('open');
  document.getElementById('goalToggleBtn').textContent = el.classList.contains('open') ? 'CLOSE ▴' : 'EDIT ▾';
  if (el.classList.contains('open')) {
    document.getElementById('ginp-cal').value = goals.cal;
    document.getElementById('ginp-pro').value = goals.pro;
    document.getElementById('ginp-crb').value = goals.crb;
    document.getElementById('ginp-fat').value = goals.fat;
  }
}
function saveGoals() {
  const cal = parseInt(document.getElementById('ginp-cal').value)||2000;
  const pro = parseInt(document.getElementById('ginp-pro').value)||150;
  const crb = parseInt(document.getElementById('ginp-crb').value)||200;
  const fat = parseInt(document.getElementById('ginp-fat').value)||65;
  goals = {cal, pro, crb, fat};
  saveGoalsDB();
  document.getElementById('goalsEdit').classList.remove('open');
  document.getElementById('goalToggleBtn').textContent = 'EDIT ▾';
  updateGoals();
  toast('Targets saved ✓');
}
function updateGoals() {
  const d = getDayData();
  let tCal=0, tProt=0, tCarb=0, tFat=0;
  d.entries.forEach(e => {
    tCal += e.cal||0;
    if (e.prot!=null) tProt += e.prot;
    if (e.carb!=null) tCarb += e.carb;
    if (e.fat!=null) tFat += e.fat;
  });
  function setBar(macro, cur, goal) {
    const pct = Math.min((cur/goal)*100, 100);
    const rem = goal - Math.round(cur);
    const bar = document.getElementById('gbar-'+macro);
    const lbl = document.getElementById('grem-'+macro);
    bar.style.width = pct+'%';
    bar.classList.toggle('over', rem < 0);
    lbl.textContent = rem < 0 ? Math.abs(rem)+(macro==='cal'?' kcal OVER':' g OVER') : rem+(macro==='cal'?' kcal left':' g left');
    lbl.classList.toggle('over', rem < 0);
  }
  setBar('cal', tCal, goals.cal);
  setBar('pro', tProt, goals.pro);
  setBar('crb', tCarb, goals.crb);
  setBar('fat', tFat, goals.fat);
}

// ═══════════ DAY NAV ═══════════
function chDay(dir) {
  const d = new Date(curDay+'T12:00:00');
  d.setDate(d.getDate()+dir);
  curDay = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  render();
}
function clearDay() {
  if (!confirm('Clear all entries for this day?')) return;
  getDayData().entries = [];
  saveDB(); render();
}

// ═══════════ FORMS ═══════════
function togItem() {
  const f = document.getElementById('itemF');
  f.classList.toggle('open');
  if (f.classList.contains('open')) {
    document.getElementById('mealF').classList.remove('open');
    document.getElementById('fn').focus();
  }
}
function togIMacro() {
  document.getElementById('imf').style.display = document.getElementById('imc').checked ? 'grid' : 'none';
}
function togMeal() {
  const m = document.getElementById('mealF');
  m.classList.toggle('open');
  if (m.classList.contains('open')) {
    document.getElementById('itemF').classList.remove('open');
    if (!document.getElementById('ingL').children.length) { addIngR(); addIngR(); }
    document.getElementById('mname').focus();
  }
}
function togMMacro() {
  document.getElementById('mmf').style.display = document.getElementById('mmc').checked ? 'grid' : 'none';
  updateMealPrev();
}

function addItem() {
  const name = document.getElementById('fn').value.trim();
  const cal = parseFloat(document.getElementById('fc').value)||0;
  if (!name) { document.getElementById('fn').focus(); return; }
  const hm = document.getElementById('imc').checked;
  const prot = hm ? (parseFloat(document.getElementById('fp').value)||0) : null;
  const carb = hm ? (parseFloat(document.getElementById('fca').value)||0) : null;
  const fat  = hm ? (parseFloat(document.getElementById('ff').value)||0) : null;
  const entry = {type:'item', name, cal, prot, carb, fat, id:Date.now()};
  getDayData().entries.push(entry);

  if (document.getElementById('isave').checked) {
    saveFood({type:'item', name, cal, prot, carb, fat});
    toast('Logged + saved to favourites ⭐');
  } else {
    toast('Added: '+name);
  }

  saveDB();
  ['fn','fc','fp','fca','ff'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  document.getElementById('imc').checked = false;
  document.getElementById('isave').checked = false;
  document.getElementById('imf').style.display = 'none';
  document.getElementById('fn').focus();
  render();
}

function addIngR() {
  const c = document.getElementById('ingL');
  const id = 'ir_'+Date.now()+'_'+Math.random().toString(36).slice(2,5);
  const r = document.createElement('div');
  r.className='ing-r'; r.id=id;
  r.innerHTML = `<input type="text" placeholder="Ingredient" oninput="updateMealPrev()" /><input type="number" placeholder="kcal" oninput="updateMealPrev()" /><button class="irem" onclick="remIng('${id}')">✕</button>`;
  c.appendChild(r);
}
function remIng(id){const e=document.getElementById(id);if(e)e.remove();updateMealPrev();}

function getIngs() {
  return Array.from(document.getElementById('ingL').querySelectorAll('.ing-r')).map(r=>{
    const ins=r.querySelectorAll('input');
    return {name:ins[0].value.trim(), cal:parseFloat(ins[1].value)||0};
  }).filter(i=>i.name||i.cal);
}

function updateMealPrev() {
  const ings = getIngs();
  const ingCal = ings.reduce((s,i)=>s+i.cal,0);
  const manCal = parseFloat(document.getElementById('mCal').value)||0;
  const finalCal = manCal || ingCal;
  const hm = document.getElementById('mmc').checked;
  document.getElementById('mpC').textContent = Math.round(finalCal) || '--';
  document.getElementById('mpP').textContent = hm ? (document.getElementById('mp').value||'--') : '--';
  document.getElementById('mpCa').textContent = hm ? (document.getElementById('mca').value||'--') : '--';
  document.getElementById('mpF').textContent = hm ? (document.getElementById('mf').value||'--') : '--';
}

function addMeal() {
  const mealName = document.getElementById('mname').value.trim() || 'Meal';
  const ings = getIngs();
  const ingCal = ings.reduce((s,i)=>s+i.cal,0);
  const manCal = parseFloat(document.getElementById('mCal').value)||0;
  const cal = manCal || ingCal;
  const hm = document.getElementById('mmc').checked;
  const prot = hm ? (parseFloat(document.getElementById('mp').value)||0) : null;
  const carb = hm ? (parseFloat(document.getElementById('mca').value)||0) : null;
  const fat  = hm ? (parseFloat(document.getElementById('mf').value)||0) : null;
  const entry = {type:'meal', name:mealName, ingredients:ings, cal, prot, carb, fat, id:Date.now()};
  getDayData().entries.push(entry);

  if (document.getElementById('msave').checked) {
    saveFood({type:'meal', name:mealName, ingredients:ings, cal, prot, carb, fat});
    toast('Logged + saved to favourites ⭐');
  } else {
    toast('Added: '+mealName);
  }

  saveDB();
  document.getElementById('mname').value='';
  document.getElementById('mCal').value='';
  document.getElementById('ingL').innerHTML='';
  document.getElementById('mmc').checked=false;
  document.getElementById('msave').checked=false;
  document.getElementById('mmf').style.display='none';
  ['mp','mca','mf'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  document.getElementById('mealF').classList.remove('open');
  render();
}

// ═══════════ RENDER LOG ═══════════
function render() {
  const day = getDayData();
  const entries = day.entries;

  const d = new Date(curDay+'T12:00:00');
  const isToday = curDay === todayKey();
  document.getElementById('dayDisp').textContent =
    (isToday?'Today -- ':'')+d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});

  let tCal=0,tProt=0,tCarb=0,tFat=0;
  entries.forEach(e=>{
    tCal+=e.cal||0;
    if(e.prot!=null) tProt+=e.prot;
    if(e.carb!=null) tCarb+=e.carb;
    if(e.fat!=null) tFat+=e.fat;
  });
  document.getElementById('tCal').textContent  = Math.round(tCal);
  document.getElementById('tProt').textContent = Math.round(tProt);
  document.getElementById('tCarb').textContent = Math.round(tCarb);
  document.getElementById('tFat').textContent  = Math.round(tFat);
  updateGoals();
  updateStreak();

  const body = document.getElementById('logB');
  if (!entries.length) { body.innerHTML='<div class="lempty">Nothing logged yet.</div>'; return; }

  body.innerHTML = entries.map(e=>{
    if(e.type==='meal'){
      const ings=(e.ingredients||[]).map(i=>`<div class="mgir"><div class="mgil1"><span class="mgin">↳ ${i.name||'--'}</span><span class="mgic">${Math.round(i.cal)} kcal</span></div></div>`).join('');
      const hasMac = e.prot!=null;
      const macLine = hasMac ? `<span class="pp">${Math.round(e.prot)}g P</span> · <span class="cp">${Math.round(e.carb)}g C</span> · <span class="fp">${Math.round(e.fat)}g F</span>` : '';
      return `<div class="mghdr"><div class="mgl"><div class="mgn">🍽 ${e.name}</div><div class="mgc"><span>${Math.round(e.cal)}</span> kcal total</div>${hasMac?`<div class="mgmac">${macLine}</div>`:''}</div><div class="lactions"><button class="ledit" onclick="openEdit(${e.id})">Edit</button><button class="ldel" onclick="delE(${e.id})">Remove</button></div></div>${ings}`;
    }
    const hm = e.prot!=null;
    const macLine = hm
      ? `<span class="pp">${Math.round(e.prot)}g P</span> · <span class="cp">${Math.round(e.carb)}g C</span> · <span class="fp">${Math.round(e.fat)}g F</span>`
      : `<span style="color:#333">macros not logged</span>`;
    return `<div class="lentry"><div class="l1"><span class="lname">${e.name}</span><span class="lcal">${Math.round(e.cal)} kcal</span></div><div class="l2"><span class="lmac">${macLine}</span><div class="lactions"><button class="ledit" onclick="openEdit(${e.id})">Edit</button><button class="ldel" onclick="delE(${e.id})">Remove</button></div></div></div>`;
  }).join('');
}

function delE(id){
  getDayData().entries=getDayData().entries.filter(e=>e.id!==id);
  saveDB();render();
}

// ═══════════ EDIT ENTRY ═══════════
function openEdit(id) {
  const entry = getDayData().entries.find(e=>e.id===id);
  if (!entry) return;
  document.getElementById('editId').value = id;
  document.getElementById('eName').value = entry.name;
  document.getElementById('eCal').value = entry.cal||'';
  document.getElementById('eProt').value = entry.prot!=null ? entry.prot : '';
  document.getElementById('eCarb').value = entry.carb!=null ? entry.carb : '';
  document.getElementById('eFat').value = entry.fat!=null ? entry.fat : '';
  document.getElementById('editM').classList.add('open');
}
function closeEdit() { document.getElementById('editM').classList.remove('open'); }
function saveEdit() {
  const id = parseInt(document.getElementById('editId').value);
  const entry = getDayData().entries.find(e=>e.id===id);
  if (!entry) return;
  entry.name = document.getElementById('eName').value.trim() || entry.name;
  entry.cal = parseFloat(document.getElementById('eCal').value)||0;
  const pv = document.getElementById('eProt').value;
  const cv = document.getElementById('eCarb').value;
  const fv = document.getElementById('eFat').value;
  entry.prot = pv !== '' ? parseFloat(pv)||0 : null;
  entry.carb = cv !== '' ? parseFloat(cv)||0 : null;
  entry.fat  = fv !== '' ? parseFloat(fv)||0 : null;
  saveDB(); closeEdit(); render();
  toast('Entry updated ✓');
}

// ═══════════ SAVED FOODS ═══════════
function saveFood(food) {
  const existing = savedFoods.findIndex(f => f.name.toLowerCase() === food.name.toLowerCase());
  if (existing >= 0) { savedFoods[existing] = {...food, savedAt: Date.now()}; }
  else { savedFoods.push({...food, savedAt: Date.now()}); }
  saveFoodsDB();
}

function addSavedToLog(idx) {
  const food = savedFoods[idx];
  if (!food) return;
  getDayData().entries.push({...food, id: Date.now()});
  saveDB();
  if (curTab === 'log') render();
  toast('Added: '+food.name+' ✓');
  // switch to log tab briefly to show it was added
  switchTab('log');
  render();
}

function deleteSaved(idx) {
  if (!confirm('Remove "'+savedFoods[idx].name+'" from favourites?')) return;
  savedFoods.splice(idx, 1);
  saveFoodsDB();
  renderSaved();
}

function renderSaved() {
  const el = document.getElementById('savedList');
  if (!savedFoods.length) {
    el.innerHTML = `<div class="saved-empty">No favourites yet.<br><br>When logging, check<br><span style="color:var(--amber)">⭐ Save to favourites</span><br>to add items here.</div>`;
    return;
  }
  el.innerHTML = savedFoods.map((f,i) => {
    const hasMac = f.prot != null;
    const macStr = hasMac
      ? ` · <span class="sp">${Math.round(f.prot)}P</span> <span class="sca">${Math.round(f.carb)}C</span> <span class="sf">${Math.round(f.fat)}F</span>`
      : '';
    return `<div class="saved-card">
      <div class="saved-info">
        <div class="saved-type">${f.type === 'meal' ? '🍽 MEAL' : '🥤 ITEM'}</div>
        <div class="saved-name">${f.name}</div>
        <div class="saved-meta"><span class="sc">${Math.round(f.cal)} kcal</span>${macStr}</div>
      </div>
      <div class="saved-actions">
        <button class="sadd" onclick="addSavedToLog(${i})">+ ADD</button>
        <button class="sdel" onclick="deleteSaved(${i})">✕</button>
      </div>
    </div>`;
  }).join('');
}

// ═══════════ HISTORY ═══════════
function renderHistory() {
  const days = Object.keys(db).sort().reverse();
  const goal = goals.cal;

  // Stats
  let streak = 0; let totalDays = days.length; let goalHits = 0;
  const sortedAsc = [...days].sort();
  let s = 0;
  for (let i = sortedAsc.length-1; i >= 0; i--) {
    const cal = Math.round(getDayData(sortedAsc[i]).entries.reduce((a,e)=>a+(e.cal||0),0));
    if (cal > 0 && cal <= goal) { s++; goalHits++; } else break;
  }
  streak = s;
  days.forEach(d => {
    const cal = getDayData(d).entries.reduce((a,e)=>a+(e.cal||0),0);
    if (cal > 0 && cal <= goal) goalHits++;
  });

  document.getElementById('histStats').innerHTML = `
    <div class="hstat"><div class="hstat-v">${streak}</div><div class="hstat-l">Day Streak</div></div>
    <div class="hstat"><div class="hstat-v">${totalDays}</div><div class="hstat-l">Days Logged</div></div>
    <div class="hstat"><div class="hstat-v">${totalDays ? Math.round((goalHits/totalDays)*100) : 0}%</div><div class="hstat-l">Goal Hit Rate</div></div>
  `;

  // Week chart
  const weekDays = [];
  for (let i=6; i>=0; i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const cal = db[k] ? Math.round(db[k].entries.reduce((a,e)=>a+(e.cal||0),0)) : 0;
    const label = d.toLocaleDateString('en-GB',{weekday:'short'}).substring(0,2);
    weekDays.push({k, cal, label, isToday: k===todayKey()});
  }
  const maxCal = Math.max(...weekDays.map(d=>d.cal), goal, 1);
  document.getElementById('histWeek').innerHTML = weekDays.map(d => {
    const h = Math.round((d.cal / maxCal) * 40);
    const cls = d.cal > goal ? 'over' : d.cal > 0 ? 'hit' : '';
    return `<div class="hist-day ${d.isToday?'today':''} ${d.cal>0&&d.cal<=goal?'hit':''}">
      <div class="hd-label">${d.label}</div>
      <div class="hd-bar-wrap"><div class="hd-bar ${cls}" style="height:${Math.max(h,2)}px"></div></div>
      <div class="hd-cal">${d.cal||''}</div>
    </div>`;
  }).join('');

  // List
  if (!days.length) {
    document.getElementById('histList').innerHTML = '<div class="saved-empty">No history yet.<br>Start logging!</div>';
    return;
  }
  document.getElementById('histList').innerHTML = days.slice(0,30).map(k => {
    const d = getDayData(k);
    const cal = Math.round(d.entries.reduce((a,e)=>a+(e.cal||0),0));
    const hit = cal > 0 && cal <= goal;
    const date = new Date(k+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
    return `<div class="hist-entry ${hit?'hit':'miss'}" onclick="jumpToDay('${k}')">
      <div><div class="he-date">${date}</div><div class="he-status ${hit?'hit':''}">${cal > goal ? '▲ OVER' : cal > 0 ? '✓ ON TRACK' : 'nothing logged'}</div></div>
      <div class="he-kcal">${cal} <span style="font-size:9px;color:var(--muted)">kcal</span></div>
    </div>`;
  }).join('');
}

function jumpToDay(k) {
  curDay = k;
  switchTab('log');
  render();
}

// ═══════════ STREAK ═══════════
function updateStreak() {
  let streak = 0;
  const goal = goals.cal;
  for (let i=0; i<365; i++) {
    const d = new Date(); d.setDate(d.getDate()-i);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const cal = db[k] ? db[k].entries.reduce((a,e)=>a+(e.cal||0),0) : 0;
    if (cal > 0 && cal <= goal) streak++;
    else if (i > 0) break;
  }
  document.getElementById('streakBadge').textContent = `🔥 ${streak} DAY${streak!==1?'S':''}`;
}

// ═══════════ CRAVING ═══════════
function openCrav() {
  const c = CRAVINGS[Math.floor(Math.random()*CRAVINGS.length)];
  const q = QUOTES[Math.floor(Math.random()*QUOTES.length)];
  document.getElementById('mT').textContent = c.t;
  document.getElementById('mB').textContent = c.b;
  document.getElementById('mQ').textContent = '"'+q+'"';
  document.getElementById('cravM').classList.add('open');
}
function closeCrav() { document.getElementById('cravM').classList.remove('open'); }
function logCravingAnyway() {
  closeCrav();
  togItem();
}

// ═══════════ TOAST ═══════════
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ═══════════ INIT ═══════════
function init() {
  document.getElementById('hdrDate').textContent = new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  ['mCal','mp','mca','mf'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.addEventListener('input',updateMealPrev);
  });
  render();
}

document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && document.getElementById('itemF').classList.contains('open')) addItem();
  if(e.key==='Escape') { closeEdit(); closeCrav(); }
});

init();
</script>
